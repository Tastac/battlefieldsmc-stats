<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-9">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.16.0/dist/bootstrap-table.min.css">
    <link rel="stylesheet" href="../css/style.css" >
  </head>
  <body>
    <div id="navbarplaceholderlb"></div>

    <div class="container text-light" margin>
      <h1 id="leaderboardtitle"><strong>All Time Score Leaderboard</strong></h1>

        <table id="leaderBoardTable" class="table table-dark table-hover" data-side-pagination="client" data-toggle="table" data-pagination="true" data-sortable="true" data-search="true">
          <thead>
            <tr>

              <th data-sortable="true" data-field="Rank">Rank</th>
              <th data-sortable="true" data-field="User">User</th>
              <th data-sortable="true" data-field="Kills">Kills</th>
              <th data-sortable="true" data-field="Wins">Wins</th>
              <th data-sortable="true" data-field="Score">Score</th>

            </tr>
          </thead>
          <tbody id="leadboardtablebody" class="tbody">
            <tr>

            </tr>
          </tbody>
        </table>
    </div>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/bootstrap-table@1.16.0/dist/bootstrap-table.min.js"></script>
    <script src="../../js/functions.js"></script>
    <script src="../../js/main.js"></script>
    <script type="text/javascript">
    var map = JSON.parse(localStorage.getItem("playermap"));
    var addLeaderboardInfo = '';
    var scoresort = map;
    scoresort.sort(function(a, b) {
      return b.score - a.score;
    });
    console.log(scoresort)
    for(var i in scoresort){
      var currentstats = scoresort[i];
      if(currentstats.score != 0){
        addLeaderboardInfo += '<tr id=' + (parseInt(i) + 1) + '>';
        addLeaderboardInfo += '<td scope="row">' + (parseInt(i) + 1) + '</td>';
        addLeaderboardInfo += '<td scope="row">' + '<img src="https://minotar.net/helm/' + currentstats.uuid + '" style="width: 20px;" alt=""> ' + currentstats.username + '</td>';
        addLeaderboardInfo += '<td scope="row">' + currentstats.kills + '</td>';
        addLeaderboardInfo += '<td scope="row">' + currentstats.wins + '</td>';
        addLeaderboardInfo += '<td scope="row">' + currentstats.score + '</td>';
        addLeaderboardInfo += '</tr>';
      }
    }
    $('#leadboardtablebody').append(addLeaderboardInfo);

    $('#leaderBoardTable').on('click-row.bs.table', function (row, $element, field) {
      console.log($element)
    })
    </script>
  </body>
</html>
